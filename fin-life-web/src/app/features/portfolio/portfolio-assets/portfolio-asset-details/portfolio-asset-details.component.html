<mat-tab-group>
  <mat-tab label="Resumo">
    <app-portfolio-asset-overview #portfolioAssetOverviewComponent />
  </mat-tab>
  <mat-tab label="Operações">
    <app-portfolio-asset-operations
      [portfolioAsset]="portfolioAsset()"
      (updateOperations)="
        portfolioAssetOverviewComponent.getPortfolioAssetMetrics()
      "
    />
  </mat-tab>
  <mat-tab label="Rentabilidade">Rentabilidade</mat-tab>
  <mat-tab label="Proventos">
    <app-portfolio-asset-events
      [portfolioAsset]="portfolioAsset()"
      (updateEvents)="
        portfolioAssetOverviewComponent.getPortfolioAssetMetrics()
      "
    />
  </mat-tab>
  <mat-tab label="Comentários">
    <app-portfolio-asset-comments [portfolioAsset]="portfolioAsset()" />
  </mat-tab>
</mat-tab-group>
